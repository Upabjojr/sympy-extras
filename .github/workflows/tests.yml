name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      # the time limits of the package were chosen on a faster machine:
      # without the factor an integral which takes 9 s of its 15 s there
      # is left unevaluated here, and its test fails
      - name: Run the tests and doctests
        env:
          SYMPY_EXTRAS_TIME_SCALE: "3"
        run: python -m pytest
      # also when a test has failed: the examples went unchecked for a
      # week behind one failing test
      - name: Run the examples in the documentation
        if: success() || failure()
        env:
          SYMPY_EXTRAS_TIME_SCALE: "3"
        run: python -m pytest --doctest-glob='*.md' README.md docs

  typecheck:
    name: mypy and pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: mypy
        run: python -m mypy
      - name: pyflakes
        run: python -m pyflakes sympy_extras conftest.py

  package:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel and import it
        run: |
          python -m pip install dist/*.whl
          python -c "import sympy_extras, sympy_extras.polys.cad; print(sympy_extras.__version__)"
