name: Release

# Publishes the package to PyPI when a tag of the form vX.Y.Z is pushed.
# The tag must match the version in sympy_extras/__init__.py.
#
# Publishing uses PyPI trusted publishing (OpenID Connect), so no API token is
# stored in the repository: register this workflow as a trusted publisher for
# the "sympy-extras" project on PyPI (owner Upabjojr, repository sympy-extras,
# workflow release.yml, environment pypi) and create the "pypi" environment
# in the repository settings.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[a-z]*[0-9]*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          version="$(python -c 'import sympy_extras; print(sympy_extras.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag v$tag does not match sympy_extras.__version__ = $version" >&2
            exit 1
          fi
      - name: Run the tests
        run: |
          python -m pip install pytest
          python -m pytest
          python -m pytest --doctest-glob='*.md' README.md docs
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sympy-extras/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
