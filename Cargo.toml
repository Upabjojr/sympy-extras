[workspace]
resolver = "2"
members = ["crates/sympy-extras-core", "crates/sympy-extras-py"]

[workspace.package]
version = "0.0.3"
edition = "2021"
license = "BSD-3-Clause"
authors = ["Francesco Bonazzi"]
repository = "https://github.com/Upabjojr/sympy-extras"
rust-version = "1.74"

[workspace.dependencies]
sympy-extras-core = { path = "crates/sympy-extras-core", version = "0.0.3" }
pyo3 = { version = "0.23", features = ["abi3-py310", "num-bigint"] }
