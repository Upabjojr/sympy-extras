[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-extras"
dynamic = ["version"]
description = "Extensions to SymPy: algorithms built on top of SymPy which are not (yet) part of SymPy itself"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Francesco Bonazzi"},
]
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.14",
]
keywords = [
    "sympy",
    "computer algebra",
    "symbolic",
    "cylindrical algebraic decomposition",
    "quantifier elimination",
    "polynomials",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "pytest",
    "mypy>=1.14",
    "pyflakes",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Upabjojr/sympy-extras"
Repository = "https://github.com/Upabjojr/sympy-extras"
Issues = "https://github.com/Upabjojr/sympy-extras/issues"
Changelog = "https://github.com/Upabjojr/sympy-extras/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "sympy_extras.__version__"}

[tool.setuptools.packages.find]
include = ["sympy_extras*"]

[tool.setuptools.package-data]
sympy_extras = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["sympy_extras"]
addopts = "--doctest-modules -p no:cacheprovider"

[tool.mypy]
python_version = "3.10"
files = ["sympy_extras", "conftest.py", "benchmarks"]
# stubs/ shadows the stubs of numpy, which SymPy imports and which do not
# parse when analysing for 3.10 (see stubs/numpy/__init__.pyi)
mypy_path = "stubs"
strict = true
# SymPy 1.14 ships no py.typed and few annotations: its sources are followed
# for the annotations they have, but calls into unannotated SymPy functions
# and values of type Any coming from SymPy cannot be flagged.
disallow_untyped_calls = false
warn_return_any = false
disallow_subclassing_any = false
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["mpmath", "mpmath.*"]
ignore_missing_imports = true


[[tool.mypy.overrides]]
# the tests compare SymPy numbers with Python literals on purpose
module = ["sympy_extras.*.tests.*", "sympy_extras.*.*.tests.*"]
strict_equality = false
